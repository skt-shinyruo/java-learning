<svg class="doc-diagram" viewBox="0 0 698 757" role="img" aria-label="虚拟机栈帧概念结构图" xmlns="http://www.w3.org/2000/svg">
  <style>
    .doc-diagram {
      --dg-stroke: #111111;
      --dg-text: #111111;
      color: var(--dg-text);
    }
    .dg-border {
      fill: #ffffff;
      stroke: var(--dg-stroke);
      stroke-width: 1.4;
      stroke-linejoin: round;
    }
    .dg-line {
      stroke: var(--dg-stroke);
      stroke-width: 1.1;
      shape-rendering: geometricPrecision;
    }
    .dg-title {
      fill: var(--dg-text);
      font: 400 23px "SimSun", "Songti SC", serif;
    }
    .dg-label-zh {
      fill: var(--dg-text);
      font: 400 22px "SimSun", "Songti SC", serif;
    }
    .dg-label-en {
      fill: var(--dg-text);
      font: 400 18px "Times New Roman", "SimSun", serif;
    }
    .dg-ellipsis {
      fill: var(--dg-text);
      font: 400 28px "Times New Roman", "SimSun", serif;
      letter-spacing: 0;
    }
    .dg-column-title {
      fill: var(--dg-text);
      font: 400 24px "SimSun", "Songti SC", serif;
    }
  </style>

  <rect class="dg-border" x="15" y="50" width="386" height="698" rx="16"/>
  <rect class="dg-border" x="423" y="50" width="111" height="698" rx="16"/>
  <rect class="dg-border" x="567" y="50" width="111" height="698" rx="16"/>

  <text class="dg-column-title" x="208" y="32" text-anchor="middle">当前线程</text>
  <text class="dg-column-title" x="478.5" y="32" text-anchor="middle">线程2</text>
  <text class="dg-column-title" x="622.5" y="32" text-anchor="middle">线程n</text>

  <text class="dg-label-zh" x="208" y="82" text-anchor="middle">当前栈帧</text>
  <text class="dg-label-en" x="208" y="111" text-anchor="middle">Current Stack Frame</text>
  <line class="dg-line" x1="15" y1="145" x2="401" y2="145"/>

  <rect class="dg-border" x="31" y="162" width="354" height="63" rx="7"/>
  <text class="dg-label-zh" x="208" y="189" text-anchor="middle">局部变量表</text>
  <text class="dg-label-en" x="208" y="212" text-anchor="middle">Local Variables Table</text>

  <rect class="dg-border" x="31" y="247" width="354" height="63" rx="7"/>
  <text class="dg-label-zh" x="208" y="274" text-anchor="middle">操作栈</text>
  <text class="dg-label-en" x="208" y="297" text-anchor="middle">Oper and Stack</text>

  <rect class="dg-border" x="31" y="332" width="354" height="63" rx="7"/>
  <text class="dg-label-zh" x="208" y="359" text-anchor="middle">动态连接</text>
  <text class="dg-label-en" x="208" y="382" text-anchor="middle">Dynamic Linking</text>

  <rect class="dg-border" x="31" y="417" width="354" height="63" rx="7"/>
  <text class="dg-label-zh" x="208" y="444" text-anchor="middle">返回地址</text>
  <text class="dg-label-en" x="208" y="467" text-anchor="middle">Return Address</text>

  <text class="dg-ellipsis" x="208" y="488" text-anchor="middle" xml:space="preserve">……　……</text>

  <line class="dg-line" x1="15" y1="503" x2="401" y2="503"/>
  <line class="dg-line" x1="15" y1="585" x2="401" y2="585"/>
  <line class="dg-line" x1="15" y1="667" x2="401" y2="667"/>

  <text class="dg-label-zh" x="208" y="550" text-anchor="middle">栈帧n</text>
  <text class="dg-label-en" x="208" y="574" text-anchor="middle">Stack Frame n</text>

  <text class="dg-label-zh" x="208" y="632" text-anchor="middle">栈帧2</text>
  <text class="dg-label-en" x="208" y="656" text-anchor="middle">Stack Frame2</text>

  <text class="dg-label-zh" x="208" y="714" text-anchor="middle">栈帧1</text>
  <text class="dg-label-en" x="208" y="738" text-anchor="middle">Stack Frame 1</text>

  <text class="dg-ellipsis" x="479.5" y="330" text-anchor="middle">……</text>
</svg>
