site_name: Java Learning Docs
site_dir: target/mkdocs
docs_dir: docs-site
strict: true
not_in_nav: |
  jvm-book/content/README.md
  jvm-book/content/02-第一部分-走近Java.md
  jvm-book/content/04-第二部分-自动内存管理.md
  jvm-book/content/09-第三部分-虚拟机执行子系统.md
  jvm-book/content/14-第四部分-程序编译与代码优化.md
  jvm-book/content/17-第五部分-高效并发.md

theme:
  name: material
  language: zh
  features:
    - header.autohide
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: light blue
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: cyan
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  font:
    text: Roboto Slab
    code: Roboto Mono

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Concurrency:
      - Overview: concurrency/index.md
      - JMM Notes: concurrency/content/jmm-notes.md
