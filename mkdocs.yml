site_name: Java Learning Docs
site_dir: target/mkdocs
docs_dir: docs-site
strict: true

theme:
  name: material
  language: zh
  features:
    - header.autohide
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: light blue
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: cyan
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  font:
    text: Roboto Slab
    code: Roboto Mono

nav:
  - Home: index.md
  - Concurrency:
      - Overview: concurrency/index.md
      - JMM Notes: concurrency/content/jmm-notes.md
      - Volatile and JMM: concurrency/content/volatile-jmm.md
      - CAS Notes: concurrency/content/cas-notes.md
      - Synchronized Notes: concurrency/content/synchronized-notes.md
      - Wait / Notify: concurrency/content/wait-notify.md
      - LockSupport: concurrency/content/lock-support.md
      - ThreadLocal: concurrency/content/thread-local.md
      - Virtual Threads: concurrency/content/virtual-threads.md
      - JMM References:
